<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Card | Shree Vinayak Enterprises</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #003366; /* Deep Corporate Blue */
            --secondary-color: #f4f4f9;
            --accent-color: #ff6600; /* Professional Orange Accent */
            --text-dark: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            padding-bottom: 30px;
        }

        .header {
            background: var(--primary-color);
            padding: 40px 20px;
            color: white;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: var(--primary-color);
            font-weight: bold;
            border: 4px solid var(--accent-color);
        }

        h1 { margin: 10px 0 5px; font-size: 1.4rem; letter-spacing: 1px; }
        p.tagline { font-size: 0.9rem; opacity: 0.9; margin-bottom: 0; }

        .content { padding: 20px; }

        .btn-link {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #ddd;
            color: var(--text-dark);
            text-decoration: none;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-link i {
            margin-right: 15px;
            font-size: 1.2rem;
            color: var(--primary-color);
            width: 25px;
        }

        .btn-link:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .services-section {
            background: #fdfdfd;
            margin: 10px 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #666;
            border: 1px dashed #ccc;
        }

        .footer {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="header">
        <div class="logo-circle">SVE</div>
        <h1>Shree Vinayak Enterprises</h1>
        <p class="tagline">Telecom & Security Solutions Provider</p>
    </div>

    <div class="content">
        <a href="tel:01143364336" class="btn-link">
            <i class="fas fa-phone-alt"></i> Call Us: 011-43364336
        </a>

        <a href="http://sveindia.co.in" target="_blank" class="btn-link">
            <i class="fas fa-globe"></i> Visit Website
        </a>

        <a href="mailto:inquiry@sveindia.co.in" class="btn-link">
            <i class="fas fa-envelope"></i> Send an Email
        </a>

        <a href="https://www.google.com/maps/search/Narayan+Plaza+Bilaspur" target="_blank" class="btn-link">
            <i class="fas fa-map-marker-alt"></i> Locate Us: Bilaspur, CG
        </a>

        <div class="services-section">
            <strong>Core Expertise:</strong><br>
            IP PBX • CCTV • Biometrics • Networking • Public Address Systems
        </div>

        <div class="footer">
            Partnered with Matrix Comsec since 2006
        </div>
    </div>
</div>

</body>
</html>
